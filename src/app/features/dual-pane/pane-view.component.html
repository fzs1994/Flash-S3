<div class="pane" (contextmenu)="onContainerContextMenu($event)">
  <div class="pane__pickers">
    <app-dropdown
      [options]="connectionOptions()"
      [value]="state.connectionId"
      (valueChange)="onConnectionChange($event)"
      placeholder="Choose a connection…"
    ></app-dropdown>
    <app-bucket-select
      [buckets]="state.buckets"
      [value]="state.bucket"
      (valueChange)="onBucketChange($event)"
      [disabled]="state.loadingBuckets || !state.connectionId"
      [placeholder]="state.loadingBuckets ? 'Loading buckets…' : 'Choose a bucket…'"
    ></app-bucket-select>
  </div>

  <div class="pane__toolbar" *ngIf="state.bucket">
    <button (click)="refresh()" title="Refresh"><i class="fi fi-sr-refresh ic-blue" [class.fi-spin]="state.loading"></i></button>
    <button (click)="startAddFolder()" title="New folder"><i class="fi fi-sr-folder ic-amber"></i></button>
    <button (click)="uploadFiles()" title="Upload files"><i class="fi fi-sr-upload ic-blue"></i></button>
    <div class="pane__spacer"></div>
    <button *ngIf="state.selectedKeys.size" (click)="download()" title="Download selected">
      <i class="fi fi-sr-download ic-green"></i>
    </button>
    <button
      *ngIf="state.selectedKeys.size && otherPaneReady()"
      (click)="copyToOtherPane(false)"
      title="Copy selected to the other pane"
    >
      <i class="fi fi-sr-copy ic-teal"></i>
    </button>
    <button
      *ngIf="state.selectedKeys.size && otherPaneReady()"
      (click)="copyToOtherPane(true)"
      title="Move selected to the other pane"
    >
      <i class="fi" [class]="moveArrowIcon" [class.ic-purple]="true"></i>
    </button>
    <button *ngIf="state.selectedKeys.size" (click)="deleteSelected()" title="Delete selected" class="danger">
      <i class="fi fi-sr-trash ic-red"></i>
    </button>
  </div>

  <div class="pane__breadcrumbs" *ngIf="state.bucket">
    <button class="crumb-back" (click)="goUp()" [disabled]="!canGoUp" title="Up a folder">
      <i class="fi fi-sr-arrow-up"></i>
    </button>
    <span *ngFor="let crumb of panes.breadcrumbs(paneId); let last = last; trackBy: trackByPrefix">
      <a (click)="onBreadcrumbClick(crumb.prefix)" [class.last]="last">{{ crumb.label }}</a>
      <span class="sep" *ngIf="!last">/</span>
    </span>
  </div>

  <div class="pane__empty" *ngIf="!state.connectionId">Choose a connection to get started.</div>
  <div class="pane__empty" *ngIf="state.connectionId && !state.bucket">Choose a bucket to browse.</div>

  <table
    class="pane__grid"
    *ngIf="state.bucket"
    appMarqueeSelect
    (marqueeStart)="onMarqueeStart()"
    (marqueeChange)="onMarqueeChange($event)"
  >
    <thead>
      <tr>
        <th class="col-name">Name</th>
        <th class="col-size">Size</th>
      </tr>
    </thead>
    <tbody>
      <tr class="pane__new-folder-row" *ngIf="addingFolder()">
        <td colspan="2">
          <i class="fi fi-sr-folder ic-amber"></i>
          <input
            type="text"
            [(ngModel)]="newFolderName"
            placeholder="Folder name"
            (keyup.enter)="confirmAddFolder()"
            (keyup.escape)="cancelAddFolder()"
          />
          <button (click)="confirmAddFolder()" title="Create"><i class="fi fi-sr-check ic-green"></i></button>
          <button (click)="cancelAddFolder()" title="Cancel"><i class="fi fi-sr-cross ic-muted"></i></button>
        </td>
      </tr>
      <tr
        *ngFor="let item of visibleItems()"
        [attr.data-select-key]="item.key"
        (click)="onRowClick(item, $event)"
        (dblclick)="onRowDoubleClick(item)"
        (contextmenu)="onRowContextMenu(item, $event)"
        [class.selected]="isSelected(item.key)"
      >
        <td class="col-name">
          <i
            class="fi"
            [class.fi-sr-folder]="item.type === 'folder'"
            [class.ic-amber]="item.type === 'folder'"
            [class.fi-sr-file]="item.type === 'file'"
            [class.ic-blue]="item.type === 'file'"
          ></i>
          {{ item.name }}
        </td>
        <td class="col-size">{{ item.type === 'file' ? formatBytes(item.size) : '' }}</td>
      </tr>
      <tr *ngIf="state.nextContinuationToken">
        <td colspan="2" class="pane__empty-row">
          <button (click)="panes.loadMore(paneId)" [disabled]="state.loading">Load more…</button>
        </td>
      </tr>
      <tr *ngIf="!state.items.length && !addingFolder()">
        <td colspan="2" class="pane__empty-row">This folder is empty.</td>
      </tr>
    </tbody>
  </table>

  <p class="pane__error" *ngIf="state.errorMessage">{{ state.errorMessage }}</p>

  <div class="s3b-loading-overlay" *ngIf="state.loading && state.bucket"><span class="s3b-spinner"></span> Loading…</div>

  <app-context-menu
    *ngIf="contextMenu() as menu"
    [x]="menu.x"
    [y]="menu.y"
    [items]="contextMenuItems()"
    (itemSelected)="onContextMenuAction($event)"
    (closed)="contextMenu.set(null)"
  ></app-context-menu>

  <app-context-menu
    *ngIf="folderContextMenu() as menu"
    [x]="menu.x"
    [y]="menu.y"
    [items]="folderContextMenuItems()"
    (itemSelected)="onFolderContextMenuAction($event)"
    (closed)="folderContextMenu.set(null)"
  ></app-context-menu>

  <app-properties-dialog
    *ngIf="propertiesItem() as item"
    [item]="item"
    [connectionId]="state.connectionId"
    [bucket]="state.bucket"
    (closed)="propertiesItem.set(null)"
  ></app-properties-dialog>

  <app-acl-dialog
    *ngIf="aclKey() as key"
    [connectionId]="state.connectionId!"
    [bucket]="state.bucket!"
    [objectKey]="key"
    (closed)="aclKey.set(null)"
  ></app-acl-dialog>

  <app-preview-dialog
    *ngIf="previewItem() as item"
    [items]="previewItems()"
    [startKey]="item.key"
    [connectionId]="state.connectionId"
    [bucket]="state.bucket"
    (closed)="previewItem.set(null)"
  ></app-preview-dialog>
</div>
