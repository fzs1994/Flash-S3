<div class="app-shell">
  <app-toolbar (newFolderRequested)="openNewFolderDialog()" (manageConnectionsRequested)="showConnectionsPanel.set(true)"> </app-toolbar>

  <div class="tab-bar" *ngIf="s3.tabs().length && !s3.dualPaneMode()">
    <div
      class="tab"
      *ngFor="let tab of s3.tabs()"
      [class.active]="tab.connectionId === s3.activeConnectionId()"
      (click)="selectTab(tab.connectionId)"
    >
      <i class="fi fi-rr-server ic-blue"></i>
      <span class="tab__label">{{ tab.name }}</span>
      <button class="tab__close" title="Close connection" (click)="closeTab(tab.connectionId, $event)">
        <i class="fi fi-rr-cross"></i>
      </button>
    </div>
    <button class="tab-add" title="Open another connection" (click)="showConnectionsPanel.set(true)">
      <i class="fi fi-rr-plus ic-blue"></i>
    </button>
  </div>

  <div class="app-body" *ngIf="!s3.dualPaneMode()">
    <aside class="sidebar" [style.width.px]="sidebarWidth()">
      <app-bucket-tree></app-bucket-tree>
    </aside>
    <div class="resizer resizer-vertical" (mousedown)="startSidebarResize($event)"></div>
    <main class="main-panel">
      <app-object-list
        (renameRequested)="openRenameDialog()"
        (generateUrlRequested)="openShareUrlDialog()"
        (copyRequested)="copyMoveMode.set('copy')"
        (moveRequested)="copyMoveMode.set('move')"
        (newFolderRequested)="openNewFolderDialog()"
        (propertiesRequested)="openPropertiesDialog()"
      ></app-object-list>
    </main>
  </div>

  <div class="app-body app-body--dual" *ngIf="s3.dualPaneMode()">
    <app-dual-pane></app-dual-pane>
  </div>

  <div class="resizer resizer-horizontal" (mousedown)="startQueueResize($event)"></div>
  <app-transfer-queue [panelHeight]="queueHeight()"></app-transfer-queue>
  <app-status-bar></app-status-bar>

  <div class="connections-overlay" *ngIf="showConnectionsPanel()">
    <div class="connections-modal">
      <div class="connections-modal__header">
        <span>Manage Connections</span>
        <button (click)="showConnectionsPanel.set(false)" [disabled]="!s3.tabs().length">
          <i class="fi fi-rr-cross"></i>
        </button>
      </div>
      <app-connection-manager (connected)="onConnected($event)"></app-connection-manager>
    </div>
  </div>

  <app-prompt-dialog
    *ngIf="dialogMode() === 'newFolder'"
    title="New Folder"
    label="Folder name"
    confirmLabel="Create"
    [value]="dialogValue"
    (confirmed)="onDialogConfirm($event)"
    (cancelled)="onDialogCancel()"
  >
  </app-prompt-dialog>

  <app-prompt-dialog
    *ngIf="dialogMode() === 'rename'"
    title="Rename"
    label="New name"
    confirmLabel="Rename"
    [value]="dialogValue"
    (confirmed)="onDialogConfirm($event)"
    (cancelled)="onDialogCancel()"
  >
  </app-prompt-dialog>

  <app-prompt-dialog
    *ngIf="dialogMode() === 'shareUrlChoice'"
    title="Share URL"
    label="Choose a link type:"
    [choices]="shareUrlChoices"
    (choiceSelected)="onShareUrlChoice($event)"
    (cancelled)="onDialogCancel()"
  >
  </app-prompt-dialog>

  <div class="toast" *ngIf="toast.toast() as t" [ngClass]="'toast-' + t.type">
    <i class="fi" [ngClass]="{
      'fi-rr-check': t.type === 'success',
      'fi-rr-cross-circle': t.type === 'danger',
      'fi-rr-triangle-warning': t.type === 'warning',
      'fi-rr-info': t.type === 'info'
    }"></i>
    <span>{{ t.message }}</span>
  </div>

  <app-copy-move-dialog *ngIf="copyMoveMode()" [mode]="copyMoveMode()!" (closed)="copyMoveMode.set(null)"> </app-copy-move-dialog>

  <app-properties-dialog
    *ngIf="propertiesItem() as item"
    [item]="item"
    [connectionId]="s3.activeConnectionId()"
    [bucket]="s3.currentBucket()"
    (closed)="propertiesItem.set(null)"
  >
  </app-properties-dialog>
</div>
