<div class="cm-overlay" (click)="cancel()">
  <div class="cm-dialog" (click)="$event.stopPropagation()">
    <h3>
      <i class="fi" [class.fi-sr-copy]="mode === 'copy'" [class.fi-sr-arrow-right]="mode === 'move'" [class.ic-blue]="true"></i>
      {{ title() }}
    </h3>

    <p class="cm-summary">
      {{ selectedItems().length }} item{{ selectedItems().length === 1 ? '' : 's' }} selected
    </p>

    <label>Destination connection</label>
    <app-dropdown
      [options]="connectionOptions()"
      [value]="destConnectionId()"
      (valueChange)="onConnectionChange($event)"
      placeholder="Choose a connection…"
    ></app-dropdown>

    <label>
      Destination bucket
      <span class="hint" *ngIf="loadingBuckets()">Loading buckets…</span>
    </label>
    <app-bucket-select
      [buckets]="destBuckets()"
      [value]="destBucket()"
      (valueChange)="onBucketChange($event)"
      [disabled]="loadingBuckets() || !destConnectionId()"
    ></app-bucket-select>

    <label>
      Destination folder
      <span class="hint">Double-click a folder to open it. Click a folder to pick it, or leave none picked to use the open folder.</span>
    </label>
    <div class="cm-browser" *ngIf="destBucket(); else pickBucket">
      <div class="cm-crumbs">
        <button class="cm-up" (click)="goUp()" [disabled]="!browsePrefix()" title="Up one level"><i class="fi fi-sr-arrow-up"></i></button>
        <button class="cm-crumb" (click)="openFolder('')">{{ destBucket() }}</button>
        <ng-container *ngFor="let c of crumbs()">
          <span class="cm-sep">/</span>
          <button class="cm-crumb" (click)="openFolder(c.prefix)">{{ c.name }}</button>
        </ng-container>
      </div>
      <div class="cm-folders">
        <div class="cm-empty" *ngIf="loadingFolders()"><span class="s3b-spinner"></span> Loading…</div>
        <div class="cm-empty" *ngIf="!loadingFolders() && !folders().length">No subfolders</div>
        <div
          class="cm-folder"
          *ngFor="let f of folders()"
          [class.selected]="selectedFolder() === f.key"
          (click)="selectedFolder.set(f.key)"
          (dblclick)="openFolder(f.key)"
        >
          <i class="fi fi-sr-folder ic-amber"></i> {{ f.name }}
        </div>
      </div>
    </div>
    <ng-template #pickBucket><div class="cm-browser cm-empty">Choose a bucket to browse its folders.</div></ng-template>
    <p class="cm-dest" *ngIf="destBucket()">
      Destination: <strong>{{ destBucket() }}/{{ destPrefix() }}</strong>
    </p>

    <p class="cm-error" *ngIf="errorMsg()">{{ errorMsg() }}</p>

    <div class="cm-actions">
      <button (click)="cancel()" [disabled]="running()">Cancel</button>
      <button class="primary" (click)="confirm()" [disabled]="running() || !destConnectionId() || !destBucket()">
        <i class="fi fi-sr-refresh" *ngIf="running()" [class.fi-spin]="running()"></i>
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</div>
